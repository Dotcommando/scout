services:
  mongodb:
    image: mongo:8.0
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '${MONGODB_PORT}:27017'

  rabbitmq:
    image: rabbitmq:4.1-alpine
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '${RABBITMQ_PORT}:5672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  discovery:
    build:
      context: .
      dockerfile: discovery/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
      DISCOVERY_MONGODB_URI: mongodb://mongodb:27017/scout_discovery
      DISCOVERY_LIVE_ARTIFACT_DIRECTORY: /workspace/artifacts/discovery-live-executions
      DISCOVERY_PORT: '3001'
      DISCOVERY_RABBITMQ_CONNECTION_TIMEOUT_MS: ${DISCOVERY_RABBITMQ_CONNECTION_TIMEOUT_MS}
      DISCOVERY_RABBITMQ_PREFETCH: ${DISCOVERY_RABBITMQ_PREFETCH}
      DISCOVERY_RABBITMQ_RETRY_DELAY_MS: ${DISCOVERY_RABBITMQ_RETRY_DELAY_MS}
      DISCOVERY_RABBITMQ_RETRY_MAX_ATTEMPTS: ${DISCOVERY_RABBITMQ_RETRY_MAX_ATTEMPTS}
      DISCOVERY_RABBITMQ_URI: amqp://rabbitmq:5672
    ports:
      - '${DISCOVERY_PORT}:3001'
    volumes:
      - ./artifacts/discovery-live-executions:/workspace/artifacts/discovery-live-executions
      - ./config/discovery:/workspace/config/discovery:ro

  qualification:
    build:
      context: .
      dockerfile: qualification/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      QUALIFICATION_MONGODB_URI: mongodb://mongodb:27017/scout_qualification
      QUALIFICATION_PORT: '3002'
      QUALIFICATION_RABBITMQ_CONNECTION_TIMEOUT_MS: ${QUALIFICATION_RABBITMQ_CONNECTION_TIMEOUT_MS}
      QUALIFICATION_RABBITMQ_PREFETCH: ${QUALIFICATION_RABBITMQ_PREFETCH}
      QUALIFICATION_RABBITMQ_RETRY_DELAY_MS: ${QUALIFICATION_RABBITMQ_RETRY_DELAY_MS}
      QUALIFICATION_RABBITMQ_RETRY_MAX_ATTEMPTS: ${QUALIFICATION_RABBITMQ_RETRY_MAX_ATTEMPTS}
      QUALIFICATION_RABBITMQ_URI: amqp://rabbitmq:5672
    ports:
      - '${QUALIFICATION_PORT}:3002'
    volumes:
      - ./config/qualification:/workspace/config/qualification:ro

volumes:
  rabbitmq_data:
