services:
  mongodb:
    image: mongo:8.0
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '${MONGODB_PORT}:27017'

  discovery:
    build:
      context: ./discovery
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
      DISCOVERY_MONGODB_URI: mongodb://mongodb:27017/scout_discovery
      DISCOVERY_PORT: '3001'
    ports:
      - '${DISCOVERY_PORT}:3001'

  qualification:
    build:
      context: ./qualification
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      QUALIFICATION_MONGODB_URI: mongodb://mongodb:27017/scout_qualification
      QUALIFICATION_PORT: '3002'
    ports:
      - '${QUALIFICATION_PORT}:3002'
